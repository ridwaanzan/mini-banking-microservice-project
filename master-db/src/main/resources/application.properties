quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:masterdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=test
quarkus.datasource.password=test

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.packages=id.co.mybank.entity

quarkus.datasource.jdbc.show=true
quarkus.datasource.jdbc.allow-other-drivers=true
quarkus.h2.console.enabled=true
quarkus.h2.console.path=/h2-console
